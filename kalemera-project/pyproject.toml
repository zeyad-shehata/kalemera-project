[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalemera-project"
version = "1.0.0"
description = "Kalemera E-commerce Fullstack Application"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "asyncpg==0.29.0",
    "SQLAlchemy==2.0.31",
    "alembic==1.13.2",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "Pillow==10.4.0",
    "python-multipart==0.0.9",
    "pydantic-settings==2.3.4",
    "aiosqlite==0.20.0",
    "httpx==0.27.0",
]
