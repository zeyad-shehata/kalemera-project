[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalemera-backend"
version = "1.0.0"
description = "Backend API for the Kalemera E-commerce application (FastAPI, SQLAlchemy async)."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "asyncpg==0.31.0",
    "SQLAlchemy==2.0.31",
    "alembic==1.13.2",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "Pillow==10.4.0",
    "python-multipart==0.0.9",
    "pydantic-settings==2.3.4",
    "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
    "black",
    "ruff",
]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"